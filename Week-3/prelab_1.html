<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling Example</title>

    <style>
        body {
            background-color: lightgreen;
        }

        ul {
            list-style-type: circle;
            margin: 10px;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2>My Favorite Subjects</h2>

    <ul>
        <li>Computer Science</li>
        <li>Mathematics</li>
        <li>Physics</li>
    </ul>

</body>
</html>
