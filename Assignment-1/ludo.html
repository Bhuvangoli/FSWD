<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDO Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2ead3;
            font-family: Arial, sans-serif;
        }

        .game {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .board {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            background: white;
            border: 8px solid #222;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

    
        .home {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            padding: 25px;
            border: 2px solid #222;
        }

        .red {
            grid-column: 1 / 7;
            grid-row: 1 / 7;
            background: #e53935;
        }

        .green {
            grid-column: 10 / 16;
            grid-row: 1 / 7;
            background: #43a047;
        }

        .yellow {
            grid-column: 1 / 7;
            grid-row: 10 / 16;
            background: #fdd835;
        }

        .blue {
            grid-column: 10 / 16;
            grid-row: 10 / 16;
            background: #1e88e5;
        }

        .circle {
            background: white;
            border: 3px solid #222;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .token {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #222;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5),
                        0 2px 4px rgba(0,0,0,0.3);
        }

        .red .token {
            background: #d32f2f;
        }

        .green .token {
            background: #2e7d32;
        }

        .yellow .token {
            background: #fbc02d;
        }

        .blue .token {
            background: #1565c0;
        }

        .cell {
            border: 1px solid #555;
            background: white;
        }

        .red-path {
            background: #ef9a9a;
        }

        .green-path {
            background: #a5d6a7;
        }

        .yellow-path {
            background: #fff59d;
        }

        .blue-path {
            background: #90caf9;
        }


        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            position: relative;
            background: conic-gradient(
                #43a047 0deg 90deg,
                #1e88e5 90deg 180deg,
                #fdd835 180deg 270deg,
                #e53935 270deg 360deg
            );
            border: 2px solid #222;
            clip-path: polygon(
                0 0, 100% 0, 100% 100%,
                0 100%
            );
        }

        .center::after {
            content: "★";
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: white;
            text-shadow: 2px 2px 4px #222;
        }

      
        .side-panel {
            width: 230px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .side-panel h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .players {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .player.red-player {
            background: #ffcdd2;
        }

        .player.green-player {
            background: #c8e6c9;
        }

        .player.yellow-player {
            background: #fff9c4;
        }

        .player.blue-player {
            background: #bbdefb;
        }

        .player-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .red-dot {
            background: #e53935;
        }

        .green-dot {
            background: #43a047;
        }

        .yellow-dot {
            background: #fdd835;
        }

        .blue-dot {
            background: #1e88e5;
        }

        .dice {
            width: 80px;
            height: 80px;
            margin: 15px auto;
            display: grid;
            place-items: center;
            background: white;
            border: 4px solid #222;
            border-radius: 12px;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        @media (max-width: 950px) {
            .game {
                flex-direction: column;
                padding: 20px;
            }

            .board {
                width: min(90vw, 600px);
                height: min(90vw, 600px);
            }
        }
    </style>
</head>

<body>

<div class="game">

    
    <div class="board">


        <div class="home red">
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
        </div>


        <div class="home green">
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
        </div>


        <div class="home yellow">
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
        </div>


        <div class="home blue">
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
            <div class="circle"><div class="token"></div></div>
        </div>


        <script>
            for (let i = 0; i < 72; i++) {
                document.write('<div class="cell"></div>');
            }
        </script>


        <div class="center"></div>

    </div>


    <div class="side-panel">

        <h1>🎲 LUDO</h1>

        <div class="players">
            <div class="player red-player">
                <span class="player-dot red-dot"></span>
                Player 1
            </div>

            <div class="player green-player">
                <span class="player-dot green-dot"></span>
                Player 2
            </div>

            <div class="player yellow-player">
                <span class="player-dot yellow-dot"></span>
                Player 3
            </div>

            <div class="player blue-player">
                <span class="player-dot blue-dot"></span>
                Player 4
            </div>
        </div>

        <h3>Current Turn</h3>

        <div class="dice">6</div>

        <button onclick="rollDice()">ROLL DICE</button>

    </div>

</div>

<script>
    function rollDice() {
        const dice = document.querySelector(".dice");
        dice.textContent = Math.floor(Math.random() * 6) + 1;
    }
</script>

</body>
</html>
